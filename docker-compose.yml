services:
  ping:
    build: ping

  calc:
    build: calc

  soma:
    build: soma

  sub:
    build: sub

  # 3 distinct instances allowing individual Nginx rules
  mult1:
    build: mult

  mult2:
    build: mult

  mult3:
    build: mult

  nginx:
    container_name: nginx
    build: nginx
    ports:
      - 8080:80
    depends_on:
      - ping
      - calc
      - soma
      - sub
      - mult1
      - mult2
      - mult3
